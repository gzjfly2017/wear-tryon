name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Job 1: CoreML 模型转换(macOS runner,产出 .mlmodelc)
  # ------------------------------------------------------------------
  convert-models:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone Mobile-VTON repo
        run: |
          git clone --depth 1 https://github.com/tmllab/2026_CVPR_Mobile-VTON.git Models/Mobile-VTON-repo

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # torch 固定 2.7.0(coremltools 官方测试的最新版本)
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          # numpy 必须 <=2.3.5(numpy>=2.4 会破坏 coremltools 导出,见 apple/coremltools#2633)
          python -m pip install "numpy<=2.3.5"
          python -m pip install "transformers==4.46.3" "diffusers==0.32.2" accelerate einops safetensors coremltools
          python -m pip install pillow tqdm

      - name: Download Mobile-VTON weights
        env:
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
        run: |
          python scripts/download_weights.py --out Models/mobile-vton --mirror "https://huggingface.co"

      - name: Verify pipeline (PyTorch sanity)
        run: |
          python scripts/verify_pipeline.py \
            --checkpoint Models/mobile-vton/checkpoint \
            --repo Models/Mobile-VTON-repo \
            --resolution 512

      - name: Convert to CoreML
        run: |
          set -o pipefail
          python scripts/convert_mobile_vton.py \
            --checkpoint Models/mobile-vton/checkpoint \
            --repo Models/Mobile-VTON-repo \
            --out build/coreml 2>&1 | tee /tmp/convert.log && CONVERT_OK=1 || CONVERT_OK=0
          if [ "$CONVERT_OK" != "1" ]; then
            echo "::error::CoreML conversion failed (app will use preview-only fallback). Last 60 lines:"
            tail -60 /tmp/convert.log
          fi
          # tokenizer 资源随模型一并产出(供 Swift CLIPTokenizerSwift 使用)
          mkdir -p build/coreml/tokenizer
          if [ -f Models/mobile-vton/checkpoint/tokenizer/vocab.json ]; then
            cp Models/mobile-vton/checkpoint/tokenizer/vocab.json build/coreml/tokenizer/
            cp Models/mobile-vton/checkpoint/tokenizer/merges.txt build/coreml/tokenizer/
          fi
          ls -la build/coreml/ || true
          exit 0

      - name: Upload CoreML models as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreml-models
          path: |
            build/coreml/*.mlmodelc
            build/coreml/tokenizer/
          retention-days: 7
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Job 2: iOS App 构建(真机目标,无签名;绕开模拟器 runtime 缺失)
  # ------------------------------------------------------------------
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    needs: convert-models
    # 创建 Release 需要写权限(默认 GITHUB_TOKEN 只读)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify MediaPipe models bundled
        run: |
          ls -la WearTryOn/Resources/Models/
          test -f WearTryOn/Resources/Models/selfie_segmenter.tflite
          test -f WearTryOn/Resources/Models/pose_landmarker_lite.task

      - name: Download CoreML models from artifact
        uses: actions/download-artifact@v4
        with:
          name: coreml-models
          path: WearTryOn/Resources/Models/
        continue-on-error: true

      - name: Copy tokenizer assets
        run: |
          mkdir -p WearTryOn/Resources/Models/tokenizer
          if [ -d WearTryOn/Resources/Models/tokenizer ] && [ -f WearTryOn/Resources/Models/tokenizer/vocab.json ]; then
            cp WearTryOn/Resources/Models/tokenizer/vocab.json WearTryOn/Resources/Models/
            cp WearTryOn/Resources/Models/tokenizer/merges.txt WearTryOn/Resources/Models/
          fi
          ls -la WearTryOn/Resources/Models/ || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods deps
        run: |
          pod install --repo-update || pod install

      - name: Build (device target, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace WearTryOn.xcworkspace \
            -scheme WearTryOn \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log || true
          if grep -q "error:" /tmp/xcodebuild.log; then
            echo "::group::Compile errors"
            grep -n "error:" /tmp/xcodebuild.log | head -60
            echo "::endgroup::"
            exit 1
          fi
          if grep -q "BUILD FAILED" /tmp/xcodebuild.log; then
            echo "::group::Build tail (last 80 lines)"
            tail -80 /tmp/xcodebuild.log
            echo "::endgroup::"
            exit 1
          fi
          echo "BUILD OK"

      - name: Package .app (device build)
        run: |
          APP_PATH=$(find build/derived/Build/Products -name "*.app" -maxdepth 3 | head -1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p dist
          cp -R "$APP_PATH" dist/WearTryOn.app
          cd dist && zip -r WearTryOn-device.app.zip WearTryOn.app

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: wear-tryon-device-app
          path: dist/
          retention-days: 14

      # ------------------------------------------------------------------
      # 发布 GitHub Release(公开仓库资产可匿名下载 + gh-proxy 镜像加速)
      # 使用仓库内置 GITHUB_TOKEN,无需额外配置
      # ------------------------------------------------------------------
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          TAG="v1.0.0"
          # 删除旧 release 同名资产(幂等重跑)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            WearTryOn-device.app.zip \
            --title "WearTryOn v1.0.0" \
            --notes "iOS 实时视频试穿第一版(纯端侧,无签名真机包)" \
            --generate-notes 2>/dev/null || \
          gh release create "$TAG" \
            WearTryOn-device.app.zip \
            --title "WearTryOn v1.0.0" \
            --notes "iOS 实时视频试穿第一版(纯端侧,无签名真机包)"
          echo "RELEASE_URL=https://github.com/gzjfly2017/wear-tryon/releases/tag/$TAG"
