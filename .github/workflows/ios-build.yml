name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Job 1: CoreML 模型转换(macOS runner,产出 .mlmodelc)
  # ------------------------------------------------------------------
  convert-models:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone Mobile-VTON repo
        run: |
          git clone --depth 1 https://github.com/tmllab/2026_CVPR_Mobile-VTON.git Models/Mobile-VTON-repo

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # 在 CN 网络环境可用 HF_ENDPOINT=https://hf-mirror.com
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install diffusers transformers accelerate safetensors coremltools
          python -m pip install numpy pillow tqdm

      - name: Download Mobile-VTON weights
        env:
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
        run: |
          python scripts/download_weights.py --out Models/mobile-vton

      - name: Convert to CoreML
        run: |
          python scripts/convert_mobile_vton.py \
            --checkpoint Models/mobile-vton/checkpoint \
            --repo Models/Mobile-VTON-repo \
            --out build/coreml

      - name: Upload CoreML models as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coreml-models
          path: build/coreml/*.mlmodelc
          retention-days: 7

  # ------------------------------------------------------------------
  # Job 2: iOS App 构建(模拟器,无签名)
  # ------------------------------------------------------------------
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    needs: convert-models
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download MediaPipe models
        run: |
          python scripts/download_mediapipe_models.py --out WearTryOn/Resources/Models

      - name: Download CoreML models from artifact
        uses: actions/download-artifact@v4
        with:
          name: coreml-models
          path: WearTryOn/Resources/Models/

      - name: Copy tokenizer assets
        run: |
          cp Models/mobile-vton/checkpoint/tokenizer/vocab.json WearTryOn/Resources/Models/vocab.json
          cp Models/mobile-vton/checkpoint/tokenizer/merges.txt WearTryOn/Resources/Models/merges.txt

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods deps
        run: |
          pod install --repo-update || pod install

      - name: Build (simulator, no signing)
        run: |
          xcodebuild \
            -workspace WearTryOn.xcworkspace \
            -scheme WearTryOn \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests (simulator)
        run: |
          xcodebuild \
            -workspace WearTryOn.xcworkspace \
            -scheme WearTryOn \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            test || echo "::warning::Unit tests failed (simulator may be unavailable)"

      - name: Package .app for simulator
        run: |
          APP_PATH=$(find build/derived/Build/Products -name "*.app" -maxdepth 3 | head -1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p dist
          cp -R "$APP_PATH" dist/WearTryOn-simulator.app
          cd dist && zip -r WearTryOn-simulator.app.zip WearTryOn-simulator.app

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: wear-tryon-simulator-app
          path: dist/
          retention-days: 14
