name: WearTryOn
options:
  bundleIdPrefix: com.wear
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
targets:
  WearTryOn:
    type: application
    platform: iOS
    sources:
      - path: WearTryOn
        excludes:
          - Resources/Models
      - path: WearTryOn/Resources/Models
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wear.tryon
        INFOPLIST_FILE: WearTryOn/Info.plist
        # CI 无签名构建不校验图标;本地真机调试时在 Xcode 中重新选择 AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"   # CI 无签名构建(模拟器),真机调试时由 Xcode 覆盖
    dependencies:
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Accelerate.framework
      - sdk: CoreML.framework
      - sdk: Vision.framework
      - sdk: Photos.framework
      - sdk: UIKit.framework
  WearTryOnTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WearTryOnTests
    dependencies:
      - target: WearTryOn
